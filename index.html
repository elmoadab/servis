        setStrikeProgress(0, fromPaid);
        function tick(now) {
          if (!holding) return;
          var elapsed = now - startTs;
          var p = Math.min(1, elapsed / HOLD_MS);
          setStrikeProgress(p, fromPaid);
          if (p >= 1) {
            holding = false; completed = true; btn.classList.remove("holding");
            commitToggle(); raf = null; return;
          }
          raf = requestAnimationFrame(tick);
        }
        raf = requestAnimationFrame(tick);
      }
      function onHoldEnd() {
        if (!holding) return;
        holding = false; btn.classList.remove("holding");
        if (raf) { cancelAnimationFrame(raf); raf = null; }
        if (completed) return;
        var fromPaid = btn.classList.contains("paid");
        strike.style.transition = "transform .28s ease-out";
        setStrikeProgress(0, fromPaid);
        setTimeout(function(){ strike.style.transition = "none"; }, 300);
      }
      btn.addEventListener("pointerdown", onHoldStart);
      btn.addEventListener("pointerup", onHoldEnd);
      btn.addEventListener("pointercancel", onHoldEnd);
      btn.addEventListener("pointerleave", onHoldEnd);
      btn.addEventListener("lostpointercapture", onHoldEnd);
      btn.addEventListener("contextmenu", function(e){ e.preventDefault(); });
      grid.appendChild(btn);
    });
    card.appendChild(grid);
    var back = document.createElement("button"); back.className = "back"; back.textContent = "← بازگشت به اطلاعات";
    back.addEventListener("click", function(){ showDetail(i); }); card.appendChild(back);
    contentEl.appendChild(card);
    window.scrollTo(0, 0);
  }

  renderTabs();
  renderAll();
})();
</script>
</body>
</html>
